# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# ===== 双屏固定布局（写死名称/分辨率/位置，避免重启或热插拔后左右顺序乱跳）=====
#   左屏  HDMI-A-1  SAC S72M 27"4K              3840x2160@60  scale 1.5  -> 逻辑 2560x1440
#   右屏  HDMI-A-2  ViewSonic VX2731-4K-HD 27"4K  3840x2160@60  scale 1.5  -> 逻辑 2560x1440，放在 x=3840
monitor = HDMI-A-1, 3840x2160@60, 0x0, 2
monitor = HDMI-A-2, 3840x2160@60, 1920x0, 2

# —— 备选（只改 scale 即可，位置跟着算：3840/scale 就是右屏的 x）——
# 觉得 1.5 偏小、但 2.4 又大：1.75 → 逻辑 2194x1234（右屏 x=2194）
# monitor = HDMI-A-1, 3840x2160@60, 0x0, 1.75
# monitor = HDMI-A-2, 3840x2160@60, 2194x0, 1.75
# 最锐、空间最紧凑：2.0 整数缩放 → 逻辑 1920x1080（右屏 x=1920），非整数缩放带来的模糊完全没有
# monitor = HDMI-A-1, 3840x2160@60, 0x0, 2
# monitor = HDMI-A-2, 3840x2160@60, 1920x0, 2
# 要 144Hz 流畅度就得降到 2K（4K 下 HDMI 只给 60Hz）：
# monitor = HDMI-A-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-2, 2560x1440@59.95, 2560x0, 1

# 兜底规则：以后新插的屏幕（DP/扩展坞）走 preferred + 自动排位，具体规则优先级更高
monitor = , preferred, auto, 1.5

# 1-3 固定左屏，4-6 固定右屏；default:true 保证登录后左屏落在 1、右屏落在 4（顺序不再随机）
workspace=1,monitor:HDMI-A-1,default:true
workspace=2,monitor:HDMI-A-1
workspace=3,monitor:HDMI-A-1
workspace=4,monitor:HDMI-A-2,default:true
workspace=5,monitor:HDMI-A-2
workspace=6,monitor:HDMI-A-2


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus   # dolphin 未安装，本机可用的是 nautilus
$menu = rofi -show drun -show-icons -font "JetBrains Mono 14"


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# 光标（只在这里设一次；文件尾部原先还有一行 XCURSOR_SIZE,32 已合并到这里）
env = XCURSOR_THEME,Adwaita   # 系统里目前只装了 Adwaita 一套光标主题
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
# 优先走原生 Wayland 后端（比转一道 XWayland 更清晰、更省 GPU）；
# 注：本机只装了 qt6-wayland（无 qt5-base），若以后装了 Qt5 程序启不来，删掉 QT_QPA_PLATFORM 那行
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false # 双 4K 核显：减少模糊合成开销
        size = 3
        passes = 1
        new_optimizations = true
        xray = true   # 不透明窗口后面不算模糊：Intel Iris Xe + 双 1440p 下最划算的一项性能优化

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 0, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0   # 0=不装默认粉毛吉祥物壁纸（本机没装壁纸程序，之前是随机动漫 logo 当背景）
    disable_hyprland_logo = true  # 同上：背景改为纯色，想要壁纸就装 hyprpaper/wpaperd 并把 exec-once 打开
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, Q, killactive
bind = $mainMod, W, exec, alacritty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle (已禁用，让位给截图)
bind = $mainMod, J, togglesplit, # dwindle
bind = SUPERSHIFT, P, exec, grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod, L, exec, /home/loyu/.local/bin/desktop-lock
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar   # Super+B 暂时隐藏/显示状态栏
bind = $mainMod SHIFT, B, exec, pkill -SIGUSR2 waybar  # Super+Shift+B 重载状态栏配置

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [1-6]：1-3=左屏(HDMI-A-1)，4-6=右屏(HDMI-A-2)
# 切到对面屏幕的工作区时，视野会跟过去；切回自己的 1-3/4-6 即回到本屏
# mainMod+Tab：在本屏最近用过的两个工作区之间来回切
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, TAB, workspace, previous

# 7-10 没有绑定屏幕，会出现就留在“当时所在屏”导致顺序乱跳；本方案只用 1-6，故移除
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window with mainMod + SHIFT + [1-6]
# 用 silent：窗口送到目标工作区（含送到对面屏），但视野留在原地不跟着跳过去
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic # 特殊工作区
#Hyprland 的工作区（Workspace）是窗口管理器中用于组织窗口的核心概念。每个工作区可以包含一组窗口，并且用户可以在不同的工作区之间切换。

# 特殊工作区是一种独立于普通工作区的特殊空间 ，通常用于以下场景：

# 隔离特定窗口 ：将某些窗口移动到特殊工作区，避免干扰其他工作区的布局。
# 临时任务 ：为临时任务或调试创建一个独立的工作区。
# 全局访问 ：特殊工作区可以在所有显示器上共享，而普通工作区通常绑定到特定显示器。


bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through workspaces with mainMod + scroll
# m: 前缀 = 只在“当前聚焦显示器”的工作区里滚动（左屏滚 1-3、右屏滚 4-6，不会滚到对面屏去）
bind = $mainMod, mouse_down, workspace, m:e+1
bind = $mainMod, mouse_up, workspace, m:e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Microphone volume control (Shift + Volume keys)
bindel = SHIFT,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+
bindel = SHIFT,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.

# Fix some dragging issues with XWayland



# 状态栏（已装 waybar 0.16 + otf-font-awesome，配置在 ~/.config/waybar/）
# 改完配置用 `pkill -USR2 waybar` 重加载；Super+B 可暂时隐藏/显示状态栏
exec-once = waybar
# 壁纸由 systemd 管理：hyprpaper.service（配置 ~/.config/hypr/hyprpaper.conf），
# 随 hypr-desktop.target 启停、崩溃自动重启；手动改配置后：systemctl --user restart hyprpaper
# （已删除 exec-once = make —— 那会在 $HOME 里跑 GNU make，纯属误加）
exec-once = fcitx5 -d --replace   # --replace：避免上次会话残留的 fcitx5 与新实例叠在一起
# 通知、权限认证、锁屏和剪贴板由 hypr-desktop.target 统一管理。
# 启动脚本先导入会话环境，避免新旧会话的 Wayland socket 混用。
# 网络连接设置通过 Waybar 右键打开，无需额外启动 nm-applet。
exec-once = /home/loyu/.local/bin/hypr-desktop-start

env = XIM,fcitx
env = XIM_PROGRAM,fcitx
env = INPUT_METHOD,fcitx
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx


# Super + U：打开浏览器。这里替换为你喜欢的浏览器。
bind=SUPER, U, exec, google-chrome-stable

# Super + P：选择区域截屏，类似于flameshot。
#bind=SUPER, P, exec, grim -g "$(slurp)" - | swappy -f -
bind=SUPER, P, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# Super + Shift + R：整屏录制开/关（当前显示器，MP4，含系统声音）
bind = $mainMod SHIFT, R, exec, /home/loyu/.local/bin/screenrecord toggle
# Super + Alt + R：框选区域录制开/关
bind = $mainMod ALT, R, exec, /home/loyu/.local/bin/screenrecord region


# Super + E 已在上方绑定为 $fileManager（本机装的是 nautilus），此处删除重复绑定

# Super + Shift + Space：将当前窗口切换到浮动模式
bind=SUPERSHIFT, SPACE, togglefloating,

# Super + Shift + C：重新加载Hyprland
bind=SUPERSHIFT, C, exec, hyprctl reload

# Super+Alt+V: Hold to record speech, release to transcribe
bindl = SUPER ALT, V, exec, echo start | socat - UNIX-CONNECT:/tmp/stt.sock
bindrt = SUPER ALT, V, exec, echo stop  | socat - UNIX-CONNECT:/tmp/stt.sock



xwayland {
  force_zero_scaling = true
}

# GDK_SCALE=2 会在 compositor 的 2.4 倍缩放之上再翻一倍（GTK/XWayland 程序 ~4.8 倍观感），
# 这是窗口类应用“还是非常大”的主因。Wayland 原生程序本来就会跟随 compositor scale，无需此变量。
# 只有某个纯 X11 程序确实偏小时，才单独用 GDK_SCALE=1 启动它。
env = GDK_SCALE,1

# ================= 双屏快捷键 =================
# Super+Ctrl+←/→：在两个屏幕之间切换焦点
bind = $mainMod CTRL, left, focusmonitor, l
bind = $mainMod CTRL, right, focusmonitor, r
# Super+SHIFT+←/→：移动窗口，到边缘时会跨到对面屏幕
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
# Super+CTRL+SHIFT+1..6：把当前窗口送到对面屏幕的工作区（1<->4 2<->5 3<->6）
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 4
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 5
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 6
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 1
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 2
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 3

# ================= 补充快捷键 =================
# Print：两块屏各存一张全屏截图（Super+P 仍是框选）
bind = , PRINT, exec, for m in $(hyprctl monitors -j | jq -r '.[].name'); do grim -o $m ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_$m.png; done
# Super+F：当前窗口全屏
bind = $mainMod, F, fullscreen,
# 剪贴板历史（需 sudo pacman -S cliphist，装好后取消注释）
# bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# 桌面优化：剪贴板历史、关闭通知、切换免打扰
bind = SUPER SHIFT, V, exec, /home/loyu/.local/bin/clipboard-menu
bind = SUPER, N, exec, makoctl dismiss
bind = SUPER SHIFT, N, exec, makoctl mode -t do-not-disturb

# 静止画面按需重绘
misc:vfr = true
