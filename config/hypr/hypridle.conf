# Idle inhibitors (video players and Waybar's stay-awake switch) are respected.
general {
    lock_cmd = /home/loyu/.local/bin/desktop-lock
    before_sleep_cmd = /home/loyu/.local/bin/desktop-lock
    after_sleep_cmd = /home/loyu/.local/bin/desktop-dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = /home/loyu/.local/bin/desktop-lock
}

listener {
    timeout = 900
    on-timeout = /home/loyu/.local/bin/desktop-dpms off
    on-resume = /home/loyu/.local/bin/desktop-dpms on
}
